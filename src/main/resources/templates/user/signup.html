<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<div layout:fragment="content">
    <div class="container-sm mt-5" style="max-width: 600px;">

        <!-- 에러 메시지 -->
        <div th:if="${msg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            [[${msg}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h3 class="mb-4">Sign Up</h3>
        <form th:action="@{/user/signup}" method="post">
            <div class="form-floating mb-3">
                <input name="email" type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating mb-3">
                <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword">Password</label>
            </div>
            <div class="form-floating mb-3">
                <input name="name" type="text" class="form-control" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>
            <div class="d-grid mt-4">
                <button class="btn btn-dark" type="submit">SIGN UP</button>
            </div>
        </form>
    </div>
</div>
</html>
