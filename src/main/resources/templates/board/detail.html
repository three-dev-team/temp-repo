<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<div layout:fragment="content" class="container-md" th:with="board=${board}">

    <h3>[ no. [[${board.bno}]] ] detail page</h3>

    <div class="mb-3">
        <label for="t" class="form-label">Title</label>
        <input type="text" th:value="${board.title}" readonly class="form-control" id="t" placeholder="title...">
    </div>

    <div class="mb-3">
        <label for="w" class="form-label">Writer</label>
        <input type="text" th:value="${board.writer}" readonly class="form-control" id="w" placeholder="writer...">
    </div>

    <div class="mb-3">
        <label for="r" class="form-label">regDate</label>
        <input type="text" th:value="${board.regDate}" readonly class="form-control" id="r">
    </div>

    <div class="mb-3">
        <label for="c" class="form-label">Content</label>
        <textarea class="form-control" id="c" readonly rows="5" cols="30">[[${board.content}]]</textarea>
    </div>

    <a th:href="@{/board/list}">
        <button type="button" class="btn btn-success">list</button>
    </a>

</div>
</html>
